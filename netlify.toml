# Netlify runs make-site.py on every push. It stamps a new version into sw.js and writes the site to dist.
[build]
  command = "python3 make-site.py"
  publish = "dist"
  # Skip the build, and so spend no credits, when nothing the app needs has changed.
  # (tests, README, CI files and notes do not change the app.)
  ignore = "test -n \"$CACHED_COMMIT_REF\" && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- index.html manifest.webmanifest sw.js netlify.toml make-site.py js css icons vendor"

# The service worker must never be cached by the browser, so updates arrive.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Big files that never change under the same name.
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
